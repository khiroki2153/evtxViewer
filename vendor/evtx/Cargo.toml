[package]
name = "evtx"
description = "A Fast (and safe) parser for the Windows XML Event Log (EVTX) format"
homepage = "https://github.com/omerbenamram/EVTX"
repository = "https://github.com/omerbenamram/EVTX"
license = "MIT/Apache-2.0"
readme = "README.md"

version = "0.12.2"
authors = ["Omer Ben-Amram <omerbenamram@gmail.com>"]
edition = "2024"

exclude = ["**/*.evtx", "**/*.dat"]

[dependencies]
bitflags = "2"
crc32fast = "1"
encoding = "0.2.33"
byteorder = "1"
thiserror = "2"
log = { version = "0.4.17", features = ["release_max_level_debug"] }
winstructs = "0.3.0"
ahash = "0.8"
# ahash pulls in getrandom transitively; on wasm32-unknown-unknown getrandom
# needs this feature (backed by the Web Crypto API) to seed anything at all.
getrandom = { version = "0.3", features = ["wasm_js"] }

serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sonic-rs = "0.5.6"
zmij = "1.0.1"
jiff = { version = "0.2.17", features = ["logging", "serde"] }
bumpalo = { version = "3.19.1", features = ["collections"] }
# `utf16-simd` is designed to be usable as a standalone crate. We opt into its
# `sonic-writeext` feature here to integrate with `sonic-rs::writer::WriteExt`
# in the hot-path JSON/XML renderers.
utf16-simd = { version = "0.1.0", path = "../utf16-simd", features = ["sonic-writeext"] }

[features]
default = []
# `evtx_dump`/`wevt_templates`/CLI-only features and their dependencies were
# dropped: this vendored copy is used as a library only (see ../README.md).
# `multithreading` (rayon) was dropped too: rayon's thread spawning doesn't
# work on wasm32-unknown-unknown without extra web worker plumbing, and we
# only ever call this from a single-threaded wasm module.

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
