[package]
name = "evtx-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
evtx = { path = "../../vendor/evtx" }
serde_json = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true

# `wasm-opt` (binaryen) post-processing is a nice-to-have size optimization,
# not a correctness requirement; skip it rather than fail the build when the
# binaryen release download is unreachable (offline/restricted networks).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
